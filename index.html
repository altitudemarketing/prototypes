<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Prototypes | Altitude Marketing</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.10-beta.2/dist/basecoat.cdn.min.css">
  <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.10-beta.2/dist/js/all.min.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .card-decoration {
      mask-image: linear-gradient(to bottom, black, transparent);
      -webkit-mask-image: linear-gradient(to left, black, transparent);
    }
  </style>
</head>
<body class="min-h-screen bg-[#1e1e1e] text-gray-100 selection:bg-blue-500 selection:text-white overflow-x-hidden">
  
  <!-- Background Logo Decoration -->
  <div class="absolute -top-[140px] -right-[780px] w-[1541px] h-[1346px] opacity-[0.05] pointer-events-none z-0">
    <img src="./assets/Altitude_Marketing_RGB_Logo-Mark.svg" class="w-full h-full object-contain brightness-0 invert" alt="">
  </div>

  <div class="container mx-auto px-6 py-12 max-w-7xl relative z-10">
    
    <!-- Header -->
    <header class="mb-16">
      <!-- Centered Logo -->
      <div class="flex justify-center mb-24">
        <img src="./assets/Altitude_Marketing_Horizontal.png" alt="Altitude Marketing" class="h-14 opacity-90 invert brightness-0 contrast-200">
      </div>
      
      <!-- Left-aligned Title -->
      <div class="text-left">
        <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Prototypes</h1>
        <p class="text-zinc-400">Interactive previews</p>
      </div>
    </header>

    <!-- Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      
      <!-- Card Template -->
      <a href="#" class="group block relative bg-white rounded-2xl overflow-hidden transition-all duration-300 hover:shadow-[0_0_40px_-10px_rgba(255,255,255,0.15)] hover:scale-[1.02] ring-1 ring-white/10 hover:ring-blue-500/50">
        
        <!-- Preview Area (Top) -->
        <div class="h-48 p-6 relative flex flex-col justify-between overflow-hidden bg-white text-gray-900">
          
          <!-- Decorative Logo Background -->
          <div class="absolute -right-4 -bottom-8 w-48 h-48 opacity-[0.08] transform rotate-12 transition-transform duration-500 group-hover:scale-110 group-hover:rotate-6">
            <img src="./assets/Altitude_Marketing_RGB_Logo-Mark.svg" class="w-full h-full object-contain" alt="">
          </div>

          <!-- Content -->
          <div class="relative z-10">
            <div class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-amber-100 text-amber-800 mb-4">
              IN PROGRESS
            </div>
            <h2 class="text-2xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors">Client Name</h2>
            <p class="text-gray-500 text-sm mt-1">Landing page prototype</p>
          </div>
        </div>

        <!-- Footer Area (Bottom) -->
        <div class="h-14 bg-zinc-900 px-4 flex items-center justify-between border-t border-zinc-100/5">
          <div class="flex items-center space-x-2 text-zinc-400">
            <div class="bg-blue-500/10 p-1 rounded-md">
              <i data-lucide="layout" class="w-3.5 h-3.5 text-blue-500"></i>
            </div>
            <span class="text-xs font-medium text-zinc-300 group-hover:text-white transition-colors">Altitude</span>
          </div>
          <span class="text-xs text-zinc-500">Edited just now</span>
        </div>
      </a>

      <!-- Altitude Commerce -->
      <a href="./altitude-commerce/" class="group block relative bg-white rounded-2xl overflow-hidden transition-all duration-300 hover:shadow-[0_0_40px_-10px_rgba(255,255,255,0.15)] hover:scale-[1.02] ring-1 ring-white/10 hover:ring-blue-500/50">

        <!-- Preview Area (Top) -->
        <div class="h-48 p-6 relative flex flex-col justify-between overflow-hidden bg-white text-gray-900">

          <!-- Decorative Logo Background -->
          <div class="absolute -right-4 -bottom-8 w-48 h-48 opacity-[0.08] transform rotate-12 transition-transform duration-500 group-hover:scale-110 group-hover:rotate-6">
            <img src="./assets/Altitude_Marketing_RGB_Logo-Mark.svg" class="w-full h-full object-contain" alt="">
          </div>

          <!-- Content -->
          <div class="relative z-10">
            <div class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-green-100 text-green-800 mb-4">
              COMPLETE
            </div>
            <h2 class="text-2xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors">E-Commerce</h2>
            <p class="text-gray-500 text-sm mt-1">Women's wear category page</p>
          </div>
        </div>

        <!-- Footer Area (Bottom) -->
        <div class="h-14 bg-zinc-900 px-4 flex items-center justify-between border-t border-zinc-100/5">
          <div class="flex items-center space-x-2 text-zinc-400">
            <div class="bg-blue-500/10 p-1 rounded-md">
              <i data-lucide="shopping-bag" class="w-3.5 h-3.5 text-blue-500"></i>
            </div>
            <span class="text-xs font-medium text-zinc-300 group-hover:text-white transition-colors">Altitude</span>
          </div>
          <span class="text-xs text-zinc-500">Basecoat CSS</span>
        </div>
      </a>

      <!-- Add more cards here as <a> tags -->

    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
